- date: 2026-10-06
  pr-link: null
  operators: [all]
  pools: [h100-dgxc, h200-dgxc, b200-nscale, b300, gb200, gb300]
  description:
    - Increase NVIDIA benchmark measurement from 5 warmups and 10 samples to 10 warmups and 100 samples.
    - Match the warmup cache and CUDA event path to measurement, then run one explicit post-finalization stabilization invocation per buffer set so the first sample represents warm-runtime steady state.
    - Preserve ordered latency samples, report descriptive latency statistics, and flag coefficient of variation above 5% without discarding or rerunning the result.
- date: 2026-10-06
  pr-link: null
  operators: [moe_forward]
  pools: [h100-dgxc]
  description:
    - Expand the strict single-GPU vLLM DeepSeek-R1-0528 MoE module benchmark to decode workloads of 4, 8, 16, 32, and 64 global tokens plus a separate 32768-token prefill workload.
    - Keep model semantics, precision, topology, synthetic fixture, execution mode, and cache policy fixed while recording requested workload identity separately from resolved vLLM execution metadata.
    - Require two identical untimed inputs to produce exactly equal finite outputs with the requested shape and dtype before accepting timing results.
- date: 2026-10-06
  pr-link: null
  operators: [all]
  pools: [h100-dgxc, h200-dgxc, b200-nscale, b300, gb200, gb300]
  description:
    - Add an explicit non-authoritative NVIDIA trace pass that profiles one warmed, cold-L2 operation boundary separately from clean latency measurement.
    - Preserve a compressed PyTorch Chrome trace with artifact size and SHA-256 integrity metadata, and summarize ordered kernels, CUDA runtime calls, memory copies, streams, and heuristic communication-kernel detection.
    - Keep shape, stack, FLOP, and memory profiling disabled so the first trace tier captures the execution timeline with less instrumentation overhead; requested and resolved shapes remain adapter metadata.
- date: 2026-10-07
  pr-link: null
  operators: [moe_forward]
  pools: [h100-dgxc, h200-dgxc, b200-nscale, b300, gb200, gb300]
  description:
    - Capture vLLM's native top-k expert IDs during untimed validation and report logical assignments, per-expert load, active experts, and Triton block-padding amplification alongside timing and trace results.
    - Record resolved router, routing, routed-expert, shared-expert, output-combination, and communication components, including the selected shared-expert linear kernel class after weight processing.
    - Separate observed trace data from resolved execution metadata, count only GPU activities as physical memory copies, and preserve correlated CUDA runtime submissions without double counting.
    - Label the software eviction-buffer cache policy as best effort rather than claiming hardware-guaranteed L2 invalidation.
- date: 2026-10-07
  pr-link: null
  operators: [moe_forward]
  pools: [b200-nscale]
  description:
    - Pin a Kimi-K3-capable vLLM 0.29 container digest and add a native single-rank KimiMoE adapter with latent projections, SiTU experts, routed normalization, and the shared path.
    - Initialize routed experts through valid packed MXFP4 weights and native weight finalization while keeping deterministic BF16 input, module validation, and resolved backend metadata outside timing.
    - Preserve the DeepSeek-R1 adapter through a shared MoE runner and model-specific adapters; reject unsupported model identities and distributed topologies instead of substituting another boundary.
